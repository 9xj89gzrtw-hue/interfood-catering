name: Multi-LLM Critic Panel

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Site URL to critique (default: production)'
        required: false
        default: 'https://interfood-catering.vercel.app'

jobs:
  critique:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture screenshots
        run: |
          npm install -g puppeteer-core @sparticuz/chromium
          cat > capture.js << 'EOF'
          const puppeteer = require('puppeteer-core');
          const chromium = require('@sparticuz/chromium');
          (async () => {
            const browser = await puppeteer.launch({
              args: chromium.args,
              executablePath: await chromium.executablePath(),
              headless: chromium.headless,
            });
            const url = process.env.TARGET_URL || 'https://interfood-catering.vercel.app';
            for (const path of ['/', '/menu', '/services', '/contacts']) {
              const page = await browser.newPage();
              await page.setViewport({ width: 1440, height: 900 });
              await page.goto(url + path, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await new Promise(r => setTimeout(r, 3500));
              const name = path === '/' ? 'home' : path.slice(1);
              await page.screenshot({ path: `screenshot-${name}.png` });
              await page.close();
            }
            await browser.close();
            console.log('Screenshots captured');
          })();
          EOF
          TARGET_URL="${{ inputs.target_url }}" node capture.js

      - name: Multi-LLM parallel critique
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          cat > critique.js << 'EOF'
          const fs = require('fs');
          const https = require('https');

          const SCREENSHOT = fs.readFileSync('screenshot-home.png').toString('base64');
          const TARGET_URL = process.env.TARGET_URL || 'https://interfood-catering.vercel.app';

          const PROMPT = `Ты — независимый эксперт по веб-дизайну для премиум-кейтеринга (СПб, 2026).
          Проанализируй скриншот главной страницы сайта ${TARGET_URL} (Interfood Catering).
          Дай 5-7 конкретных замечаний с предложенными фиксами. Формат:
          ### N. [Категория] Проблема
          **Проблема**: ...
          **Фикс**: ...
          На русском. Будь конкретен и критичен.`;

          async function callAPI(name, fn) {
            try {
              const content = await fn();
              return { model: name, content, ok: true };
            } catch (e) {
              return { model: name, content: '', ok: false, error: e.message.slice(0, 200) };
            }
          }

          async function callOpenAI() {
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: [
                  { type: 'text', text: PROMPT },
                  { type: 'image_url', image_url: { url: `data:image/png;base64,${SCREENSHOT}` } },
                ]}],
                max_tokens: 1200,
              }),
            });
            if (!res.ok) throw new Error(`OpenAI ${res.status}: ${(await res.text()).slice(0,150)}`);
            const d = await res.json();
            return d.choices[0].message.content;
          }

          async function callGroq() {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${process.env.GROQ_API_KEY}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [{ role: 'user', content: PROMPT + '\n\n(Примечание: скриншот недоступен в текстовом режиме — анализируй по описанию: премиум-кейтеринг СПб, тёмный hero с видео, gold акцент, реальные цены 390-6970₽, 12 услуг)' }],
                max_tokens: 1200,
              }),
            });
            if (!res.ok) throw new Error(`Groq ${res.status}: ${(await res.text()).slice(0,150)}`);
            const d = await res.json();
            return d.choices[0].message.content;
          }

          async function callDeepSeek() {
            const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${process.env.DEEPSEEK_API_KEY}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [{ role: 'user', content: PROMPT + '\n\n(Анализируй по описанию: премиум-кейтеринг СПб, тёмный hero, gold акцент, реальные цены 390-6970₽)' }],
                max_tokens: 1200,
              }),
            });
            if (!res.ok) throw new Error(`DeepSeek ${res.status}: ${(await res.text()).slice(0,150)}`);
            const d = await res.json();
            return d.choices[0].message.content;
          }

          async function callGoogle() {
            const parts = [{ text: PROMPT }, { inline_data: { mime_type: 'image/png', data: SCREENSHOT } }];
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GOOGLE_AI_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts }] }),
            });
            if (!res.ok) throw new Error(`Google ${res.status}: ${(await res.text()).slice(0,150)}`);
            const d = await res.json();
            return d.candidates?.[0]?.content?.parts?.[0]?.text || 'no content';
          }

          async function callCerebras() {
            const res = await fetch('https://api.cerebras.ai/v1/chat/completions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${process.env.CEREBRAS_API_KEY}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'llama3.1-8b',
                messages: [{ role: 'user', content: PROMPT + '\n\n(Анализируй по описанию: премиум-кейтеринг СПб, тёмный hero, gold акцент, цены 390-6970₽)' }],
                max_tokens: 1200,
              }),
            });
            if (!res.ok) throw new Error(`Cerebras ${res.status}: ${(await res.text()).slice(0,150)}`);
            const d = await res.json();
            return d.choices[0].message.content;
          }

          (async () => {
            const models = [
              { name: 'OpenAI GPT-4o-mini', fn: callOpenAI },
              { name: 'Google Gemini 2.0 Flash', fn: callGoogle },
              { name: 'Groq LLaMA 3.3 70B', fn: callGroq },
              { name: 'DeepSeek Chat', fn: callDeepSeek },
              { name: 'Cerebras LLaMA 3.1 8B', fn: callCerebras },
            ];
            const results = await Promise.all(models.map(m => callAPI(m.name, m.fn)));
            const ok = results.filter(r => r.ok).length;
            console.log(`\n=== ${ok}/${results.length} models responded ===\n`);
            let md = `# Multi-LLM Critic Panel\n\nTarget: ${TARGET_URL}\nDate: ${new Date().toISOString()}\nModels responded: ${ok}/${results.length}\n\n`;
            for (const r of results) {
              md += `---\n\n## ${r.name} ${r.ok ? '✓' : '✗ ' + (r.error||'')}\n\n${r.content || '(no response)'}\n\n`;
            }
            fs.writeFileSync('research/multi-llm-critique.md', md);
            console.log('Saved to research/multi-llm-critique.md');
            results.forEach(r => {
              console.log(`\n=== ${r.name} ${r.ok?'✓':'✗'} ===`);
              console.log((r.content || r.error || '').slice(0, 500));
            });
          })();
          EOF
          TARGET_URL="${{ inputs.target_url }}" node critique.js

      - name: Save results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/multi-llm-critique.md || true
          git commit -m "chore: multi-LLM critique results [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
