<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Офлайн — Интерфуд Кейтеринг</title>
  <meta name="theme-color" content="#B8955A">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,sans-serif;
      background:#FEFDFB;
      color:#1A1A1A;
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:2rem;text-align:center;
    }
    .container{max-width:420px}
    .logo{font-family:Georgia,serif;font-size:1.4rem;color:#B8955A;letter-spacing:.08em;margin-bottom:1.5rem}
    .icon{font-size:4rem;opacity:.6;margin-bottom:1rem}
    h1{font-family:Georgia,serif;font-size:1.8rem;font-weight:400;margin-bottom:.75rem}
    p{color:#666;line-height:1.7;margin-bottom:2rem;font-size:.95rem}
    .phone{
      display:inline-flex;align-items:center;gap:.5rem;
      padding:.8rem 2rem;background:#B8955A;color:#fff;
      text-decoration:none;border-radius:100px;font-size:.95rem;
      transition:background .2s;
    }
    .phone:hover{background:#a07d48}
    .phone svg{width:18px;height:18px;fill:currentColor}
    .retry{
      display:block;margin-top:1.5rem;color:#B8955A;
      text-decoration:underline;cursor:pointer;font-size:.9rem;
      background:none;border:none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">ИНТЕРФУД</div>
    <div class="icon">🍽</div>
    <h1>Нет подключения</h1>
    <p>Проверьте соединение с интернетом и попробуйте снова. Наши менеджеры всегда на связи по телефону.</p>
    <a href="tel:+78129195911" class="phone">
      <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.24 1.01l-2.21 2.2z"/></svg>
      +7 (812) 919-59-11
    </a>
    <button class="retry" onclick="window.location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
